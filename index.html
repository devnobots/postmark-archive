<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard Gauge — スタンダードゲージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Shippori+Mincho:wght@400;600;800&display=swap">
<style>
  :root {
    --paper: #f5f2eb;
    --card: #FFFDF6;
    --ink: #1a2433;
    --ink-2: #3A4658;
    --ink-3: #6b6e72;
    --rule: #E2DCCD;
    --post: #24418A;
    --serif: 'Old Standard TT', 'Shippori Mincho', serif;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body { font-family: var(--serif); color: var(--ink); overflow: hidden; }

  /* the design is drawn at 1280x880 and scaled to fit the window */
  #frame { position: absolute; left: 50%; top: 50%; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 880px; overflow: hidden; background: var(--paper); transform-origin: 0 0; }

  /* ---------- access gate ---------- */
  body.locked #frame { visibility: hidden; }
  #gate { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--paper); transition: opacity 0.4s ease; }
  #gate.out { opacity: 0; pointer-events: none; }
  .gate-box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .gate-seal { width: 96px; height: 96px; border-radius: 50%; background: var(--ink); color: var(--card); display: flex; align-items: center; justify-content: center; font: 700 13px/1.15 Arial, Helvetica, sans-serif; letter-spacing: 0.5px; box-shadow: 0 8px 20px rgba(30,42,58,0.25); margin-bottom: 6px; }
  .gate-box label { font-size: 15px; color: var(--ink-2); letter-spacing: 1px; }
  .gate-row { display: flex; gap: 8px; }
  .gate-row input { width: 140px; padding: 10px 12px; font: 18px var(--serif); letter-spacing: 4px; text-align: center; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; }
  .gate-row input:focus { outline: 2px solid var(--post); outline-offset: 1px; }
  .gate-row button { padding: 10px 18px; font: 600 15px var(--serif); color: var(--card); background: var(--ink); border: 0; border-radius: 4px; cursor: pointer; }
  .gate-err { min-height: 1.4em; font-size: 13px; color: #C2412D; }
  .gate-box.shake { animation: gate-shake 0.35s ease; }
  @keyframes gate-shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }


  /* ---------- stamp ---------- */
  .stamp { position: relative; width: 156px; color: var(--ink); font-family: var(--serif); text-align: left; }
  .stamp-shadow { width: 156px; filter: drop-shadow(0 10px 10px hsla(28, 25%, 20%, 0.07)) drop-shadow(0 2px 3px hsla(28, 25%, 20%, 0.04)); transition: filter 1.25s ease; }
  .fan-stamp.up .stamp-shadow { filter: drop-shadow(0 20px 16px hsla(28, 25%, 20%, 0.12)) drop-shadow(0 4px 5px hsla(28, 25%, 20%, 0.06)); }
  #stampBtn .stamp-shadow { filter: drop-shadow(0 20px 16px hsla(28, 25%, 20%, 0.12)) drop-shadow(0 4px 5px hsla(28, 25%, 20%, 0.06)); } /* listing stamp: always the stronger shadow */
  .stamp-paper {
    width: 156px; padding: 6px; background: #faf8f5;
    -webkit-mask: radial-gradient(circle at 6px 6px, transparent 3.4px, #000 3.9px) -6px -6px / 12px 12px, linear-gradient(#000 0 0) content-box;
            mask: radial-gradient(circle at 6px 6px, transparent 3.4px, #000 3.9px) -6px -6px / 12px 12px, linear-gradient(#000 0 0) content-box;
  }
  .stamp-inner { height: 100%; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .stamp-art { position: relative; overflow: hidden; flex: none; }
  .stamp-art img.cut { position: absolute; left: 10px; width: 112px; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(30,42,58,0.3)); }
  .stamp-art img.bleed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stamp-price { position: absolute; top: 5px; right: 6px; font-weight: 700; font-size: 12px; letter-spacing: -0.2px; }
  .stamp-cap { display: flex; flex-direction: column; gap: 2px; padding: 0 2px; }
  .cap-name { font-size: 10.5px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; }
  .cap-size { font-size: 8.5px; color: var(--ink-2); }
  .postmark { position: absolute; right: -34px; width: 110px; height: 64px; transform: rotate(-12deg); mix-blend-mode: multiply; opacity: 0.85; pointer-events: none; }

  /* ---------- fan ---------- */
  .fan-stamp {
    position: absolute; left: 562px; top: 238px; width: 156px; height: 192px; padding: 0; border: 0; background: none;
    pointer-events: none; transform-origin: 78px 480px; opacity: 0;
  }
  .fan-stamp:focus-visible { outline: 2px solid var(--post); outline-offset: 4px; }
  #hit { position: absolute; left: 120px; top: 138px; width: 1040px; height: 470px; z-index: 55; }

  #seal {
    position: absolute; left: 572px; top: 452px; width: 136px; height: 136px; border-radius: 50%; border: 0; padding: 0;
    background: var(--ink); color: var(--card); cursor: pointer; z-index: 60; display: flex; align-items: center; justify-content: center;
    transform: scale(1.35); opacity: 0; box-shadow: 0 30px 50px rgba(30,42,58,0);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, box-shadow 0.6s ease;
  }
  #seal.in { transform: scale(1); opacity: 1; box-shadow: 0 10px 24px rgba(30,42,58,0.28); }
  .seal-ring { width: 118px; height: 118px; border-radius: 50%; border: 1.5px dashed rgba(255,253,246,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .seal-top { font-style: italic; font-size: 10px; letter-spacing: 1px; opacity: 0.85; }
  .seal-name { font-weight: 700; font-size: 16px; line-height: 1.05; letter-spacing: 1px; text-align: center; }
  .seal-kana { font-family: 'Shippori Mincho', serif; font-size: 9px; letter-spacing: 1px; opacity: 0.8; }

  .copy { position: absolute; left: 0; right: 0; top: 602px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; opacity: 0; transform: translateY(14px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .copy.in { opacity: 1; transform: none; }
  .copy h1 { margin: 0; font-weight: 800; font-size: 52px; letter-spacing: 1px; line-height: 1.15; }
  .copy p { margin: 0; }
  .sub { font-size: 17px; color: var(--ink-2); }
  .hint { font-size: 12px; color: var(--ink-3); }
  .note { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-size: 12px; color: #6B7586; }

  /* ---------- listing ---------- */
  #overlay { position: absolute; inset: 0; z-index: 100; background: rgba(244,241,234,0.94); display: none; align-items: center; justify-content: center; }
  #overlay.open { display: flex; }
  .panel { position: relative; width: 1040px; height: 640px; background: var(--card); border: 1px solid var(--rule); box-shadow: 0 30px 60px rgba(30,42,58,0.18); padding: 48px 72px; display: flex; gap: 88px; align-items: center; }
  .icon-btn { position: absolute; width: 44px; height: 44px; border: 0; background: none; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .panel > .icon-btn { top: 16px; right: 16px; }
  .left-col { flex: none; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  #stampBtn { position: relative; display: block; width: 281px; height: 432px; padding: 0; border: 0; background: none; cursor: none; }
  #stampBtn .scaler { position: absolute; left: 0; top: 0; width: 156px; height: 240px; transform: scale(1.8); transform-origin: 0 0; }
  #loupe { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--ink); box-shadow: 0 12px 28px rgba(30,42,58,0.35); pointer-events: none; background-color: #fff; background-repeat: no-repeat; display: none; }
  .right-col { flex: 1; display: flex; flex-direction: column; gap: 20px; }
  .found { font-size: 13px; color: var(--post); letter-spacing: 0.5px; }
  .title h2 { margin: 0; font-weight: 800; font-size: 40px; line-height: 1.15; }
  .title div { font-size: 15px; color: var(--ink-3); margin-top: 6px; }
  .meas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 32px; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .meas div { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
  .meas span:first-child { color: var(--ink-3); }
  .meas span:last-child { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums lining-nums; }
  .cond { display: flex; gap: 14px; font-size: 15px; }
  .cond span { color: var(--ink-3); }
  .cond b { font-weight: 700; }
  .buy-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .buy { display: flex; flex-direction: column; gap: 16px; }
  .price { display: flex; align-items: baseline; gap: 12px; }
  .price b { font-weight: 700; font-size: 34px; }
  .price span { font-size: 13px; color: var(--ink-3); }
  .cart { align-self: flex-start; min-height: 52px; padding: 0 36px; border: 0; background: var(--ink); color: var(--card); font-family: var(--serif); font-weight: 700; font-size: 16px; cursor: pointer; }
  .thumbs { display: flex; gap: 10px; }
  .thumbs button { width: 78px; height: 104px; padding: 0; background: #fff; border: 1px solid #D9D2C2; cursor: pointer; overflow: hidden; }
  .thumbs button.on { border: 3px solid var(--ink); }
  .thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; }

  #full { position: absolute; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; }
  #full.open { display: flex; }
  #fullBg { position: absolute; inset: 0; border: 0; padding: 0; background: rgba(30,42,58,0.82); cursor: zoom-out; }
  .full-box { position: relative; width: 576px; height: 768px; background: #fff; box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
  /* full-view loupe: 30% larger than the listing loupe, fine edge, hairline crosshair; centered on the pointer */
  #fullLoupe { position: absolute; width: 208px; height: 208px; border-radius: 50%; border: 1px solid rgba(26,36,51,0.45);
    box-shadow: 0 12px 28px -4px hsla(28, 25%, 20%, 0.18), inset 0 0 0 1px rgba(255,255,255,0.5);
    background-color: #fff; background-repeat: no-repeat; pointer-events: none; z-index: 5;
    opacity: 0; transform: translate(-50%, -50%) scale(0.9); transition: opacity 160ms ease, transform 160ms ease; }
  #fullLoupe.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #fullLoupe::before, #fullLoupe::after { content: ''; position: absolute; background-color: rgba(26,36,51,0.35); }
  #fullLoupe::before { top: 0; left: 50%; width: 1px; height: 100%; transform: translateX(-50%); }
  #fullLoupe::after { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
  .full-box.zooming { cursor: none; }
  .full-box img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #full .icon-btn { top: 20px; right: 20px; color: var(--card); }
  .legend { font-size: 11px; color: var(--ink-3); margin-top: -12px; letter-spacing: 0.3px; }
  .title h2 { word-break: keep-all; } /* long names wrap at their spaces, never mid-word */
  .site-header { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: center; align-items: center; padding: 48px 0 24px; z-index: 70; }
  .brand-title { font-family: 'Old Standard TT', serif; font-size: 16px; font-weight: 400; letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase; color: #1a2433; margin: 0; }
  .drop-status-lockup { display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 11px; letter-spacing: 0.16em; color: #6b6e72; }
  .drop-status-lockup.at-top { position: absolute; left: 0; right: 0; top: 82px; z-index: 70; }
  .drop-status-lockup.at-bottom { margin-top: 2px; }
  .drop-status-current { color: #1a2433; font-weight: 500; }
  .drop-status-link { color: #6b6e72; text-decoration: none; border-bottom: 1px solid rgba(107, 110, 114, 0.35); padding-bottom: 2px; transition: color 150ms ease, border-color 150ms ease; }
  .drop-status-link:hover { color: #1a2433; border-bottom-color: #1a2433; }
  .cap-issue { margin-top: auto; padding: 0 2px 1px; font-size: 6.5px; letter-spacing: 0.08em; color: var(--ink-3); text-align: right; }
  /* desktop legibility */
  .cap-name { font-size: 11.5px; letter-spacing: -0.01em; }
  .cap-size { font-size: 10px; }
  .hint { font-size: 14px; }
  .drop-status-lockup { font-size: 13px; }
  .found { font-size: 14px; }
  .legend { font-size: 12.5px; }
</style>
</head>
<body class="locked">
<div id="gate">
  <form class="gate-box" id="gateForm">
    <div class="gate-seal">STANDARD<br>GAUGE</div>
    <label for="gateCode">アクセスコード</label>
    <div class="gate-row">
      <input id="gateCode" type="password" inputmode="numeric" autocomplete="off" required>
      <button type="submit">入る</button>
    </div>
    <div class="gate-err" id="gateErr" aria-live="polite"></div>
  </form>
</div>
<div id="frame"><div id="stage">

  <header class="site-header"><div class="brand-title">STANDARD GAUGE</div></header>

  <div id="fan"></div>
  <div id="hit" aria-hidden="true"></div>


  <div class="copy" id="copy">
    <h1>アメリカから、一点もの。</h1>
    <p class="sub">見つけた町と日付を添えて、ひとつずつお届けします。</p>
    <p class="hint" id="hint">切手にカーソル → 拡大　クリック → 詳細</p>
    <div class="drop-status-lockup at-bottom"><span class="drop-status-current">第12便 公開中</span><span class="drop-status-dot" aria-hidden="true">·</span><a class="drop-status-link" href="drops.html">過去の便を見る →</a></div>
  </div>


  <div id="overlay" role="dialog" aria-modal="true" aria-label="商品詳細">
    <div class="panel">
      <button class="icon-btn" id="closeBtn" aria-label="閉じる"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/></svg></button>
      <div class="left-col">
        <button id="stampBtn" aria-label="写真を大きく表示">
          <div class="scaler" id="bigStamp"></div>
          <div id="loupe"></div>
        </button>
      </div>
      <div class="right-col">
        <div class="found" id="found"></div>
        <div class="title"><h2 id="nameJa"></h2><div id="nameEn"></div></div>
        <div class="meas" id="meas"></div>
        <div class="cond"><span>状態ランク</span><b id="grade"></b><span id="gradeNote"></span></div>
        <div class="legend">S 新品同様 · A 目立つダメージなし · B 使用感あり · C 目立つダメージあり · D 難あり</div>
        <div class="buy-row">
          <div class="buy">
            <div class="price"><b id="price"></b><span>送料込み</span></div>
            <button class="cart">カートに入れる</button>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="full" role="dialog" aria-modal="true" aria-label="写真">
    <button id="fullBg" aria-label="閉じる"></button>
    <div class="full-box"><img id="fullImg" alt=""><div id="fullLoupe"></div></div>
    <button class="icon-btn" id="fullClose" aria-label="閉じる"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/></svg></button>
  </div>

</div></div>

<script>

var ACCESS_CODE = '1234';

// ---------------- data (names, prices, sizes and towns are samples) ----------------
// the current drop: number and release date (Japan time). Everything else reads from here.

var ITEMS = [

var SPREAD = 78; // total opening of the fan, in degrees
var ANG = ITEMS.map(function (d, i) { return ITEMS.length > 1 ? -SPREAD / 2 + i * SPREAD / (ITEMS.length - 1) : 0; });
var MID = (ITEMS.length - 1) / 2;

// ---------------- scale the 1280x880 design to the window ----------------
var frame = document.getElementById('frame'), stage = document.getElementById('stage');
function fit() {
  var k = Math.min(window.innerWidth / 1280, window.innerHeight / 880);
  stage.style.transform = 'scale(' + k + ')';
  frame.style.width = (1280 * k) + 'px'; frame.style.height = (880 * k) + 'px';
  frame.style.marginLeft = (-640 * k) + 'px'; frame.style.marginTop = (-440 * k) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------------- stamp markup ----------------
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function stampHTML(d, view, opts) {
  var tall = opts && opts.tall, postmark = !(opts && opts.postmark === false);
  var sz = tall ? { h: 240, art: 176, img: 124, imgTop: 26, pm: 48 } : { h: 192, art: 122, img: 94, imgTop: 22, pm: 46 };
  var pic = view.bleed
    ? '<img class="bleed" src="' + view.img + '" alt="' + esc(d.nameJa) + '">'
    : '<img class="cut" src="' + view.img + '" alt="' + esc(d.nameJa) + '" style="top:' + sz.imgTop + 'px;height:' + sz.img + 'px">';
  var pm = postmark ? (
    '<div class="postmark" style="bottom:' + sz.pm + 'px"><svg viewBox="0 0 110 64" width="110" height="64" aria-hidden="true" fill="none" stroke="#24418A" stroke-width="1.6">' +
    '<path d="M0 22 q6 -5 12 0 t12 0 t12 0 t12 0"/><path d="M0 32 q6 -5 12 0 t12 0 t12 0 t12 0"/><path d="M0 42 q6 -5 12 0 t12 0 t12 0 t12 0"/>' +
    '<circle cx="80" cy="32" r="25"/><circle cx="80" cy="32" r="17" stroke-width="0.9"/>' +
    '<g fill="#24418A" stroke="none" font-family="Old Standard TT, serif" text-anchor="middle">' +
    '<text x="80" y="13.5" font-size="5.6" font-weight="700">' + esc(d.city.split(' ').pop().toUpperCase()) + '</text>' +
    '<text x="80" y="32" font-size="8" font-weight="700">' + esc(d.date) + '</text>' +
    '<text x="80" y="41.5" font-size="7" font-weight="700">' + esc(d.year) + '</text>' +
    '<text x="80" y="54" font-size="5.6">U.S.A.</text></g></svg></div>') : '';
  return '<div class="stamp" style="height:' + sz.h + 'px"><div class="stamp-shadow" style="height:' + sz.h + 'px"><div class="stamp-paper" style="height:' + sz.h + 'px"><div class="stamp-inner">' +
    '<div class="stamp-art" style="height:' + sz.art + 'px;background:' + d.bg + '">' + pic +
    '<div class="stamp-price" style="color:' + (d.ink || '#1E2A3A') + '">' + esc(d.price) + '</div></div>' +
    '<div class="stamp-cap"><div class="cap-name">' + esc(d.capJa || d.nameJa) + '</div><div class="cap-size">' + esc(d.size) + '</div></div>' +
    (tall ? '' : '<div class="cap-issue">' + DROP_LABEL + '</div>') +
    '</div></div></div>' + pm + '</div>';
}

// ---------------- fan ----------------
var state = { fanned: false, lifted: -1, mode: 'fan', open: -1, view: 0 };
var fanEl = document.getElementById('fan');
var fanBtns = ITEMS.map(function (d, i) {
  var b = document.createElement('button');
  b.className = 'fan-stamp';
  b.setAttribute('aria-label', d.nameJa + ' ' + d.price);
  b.innerHTML = stampHTML(d, d.views[0], { postmark: false });
  b.addEventListener('focus', function () { if (state.fanned) setLift(i); });
  b.addEventListener('blur', function () { setLift(-1); });
  b.addEventListener('click', function () { if (state.fanned) openItem(i); });
  fanEl.appendChild(b);
  return b;
});

function renderFan() {
  fanBtns.forEach(function (b, i) {
    var a = ANG[i], dist = Math.abs(i - MID);
    var tf, z = 10 + i, delay = 0, op = 1, dur = 450, ease = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
    if (!state.fanned) {
      tf = 'rotate(' + (a * 0.15) + 'deg) translateY(60px) scale(0.9)'; // stacked at the center before dealing
      op = 0; dur = 380;
      delay = state.mode === 'fan' ? Math.round((MID - dist) * 40) : 0;
    } else if (state.lifted === i) {
      tf = 'rotate(' + a + 'deg) translateY(-34px) translateY(-384px) scale(1.25) translateY(384px)';
      z = 50; dur = 1250; // the hover rise
    } else {
      tf = 'rotate(' + a + 'deg) translateY(-14px)';
      if (state.mode === 'fan') { delay = Math.round(dist * 110 + (i > MID ? 55 : 0)); dur = 720; ease = 'cubic-bezier(0.34, 1.4, 0.64, 1)'; }
    }
    b.style.transition = 'transform ' + dur + 'ms ' + ease + ' ' + delay + 'ms, opacity 0.25s ease ' + delay + 'ms';
    b.style.transform = tf; b.style.opacity = op; b.style.zIndex = z;
    b.classList.toggle('up', state.lifted === i);
  });
    hit.style.cursor = state.lifted >= 0 ? 'pointer' : 'default';
}
function setLift(i) { if (i === state.lifted) return; state.lifted = i; state.mode = 'lift'; renderFan(); }
function setFanned(v) { state.fanned = v; state.mode = 'fan'; state.lifted = -1; renderFan(); }

// hover is decided by the mouse's angle around the seal (the fan's pivot), not by the moving stamps
var hit = document.getElementById('hit');
hit.addEventListener('mousemove', function (e) {
  if (!state.fanned || state.open >= 0) return;
  var r = hit.getBoundingClientRect(), k = 1040 / (r.width || 1040);
  var x = 120 + (e.clientX - r.left) * k, y = 138 + (e.clientY - r.top) * k;
  var dx = x - 640, dy = 718 - y, rad = Math.sqrt(dx * dx + dy * dy), idx = -1;
  if (rad > 270 && rad < 620 && dy > 0) {
    var ang = Math.atan2(dx, dy) * 180 / Math.PI, half = (ANG[1] - ANG[0]) / 2, cur = state.lifted;
    if (cur >= 0 && Math.abs(ang - ANG[cur]) < half + 4) idx = cur; // hysteresis
    else {
      var best = -1, bd = 1e9;
      ANG.forEach(function (a, i) { var dd = Math.abs(ang - a); if (dd < bd) { bd = dd; best = i; } });
      if (bd < half + 8) idx = best;
    }
  }
  setLift(idx);
});
hit.addEventListener('mouseleave', function () { setLift(-1); });
hit.addEventListener('click', function () { if (state.fanned && state.lifted >= 0) openItem(state.lifted); });


// ---------------- opening: seal presses in, headline rises, stamps deal out once images are ready ----------------
renderFan();
function startOpening() {
    setTimeout(function () { document.getElementById('copy').classList.add('in'); }, 380);
  var srcs = []; ITEMS.forEach(function (d) { d.views.forEach(function (v) { srcs.push(v.img); }); });
  var left = srcs.length, ready = false, waited = false, done = false;
  function go() { if (!done && ready && waited) { done = true; setFanned(true); } }
  srcs.forEach(function (u) { var im = new Image(); im.onload = im.onerror = function () { if (--left === 0) { ready = true; go(); } }; im.src = u; });
  setTimeout(function () { waited = true; go(); }, 820);
  setTimeout(function () { ready = true; waited = true; go(); }, 2500); // never wait longer than this
}

// ---------------- access gate: a gentle client-side lock, not real security ----------------
(function () {
  var gate = document.getElementById('gate'), form = document.getElementById('gateForm');
  var input = document.getElementById('gateCode'), err = document.getElementById('gateErr');
  function unlock(animate) {
    document.body.classList.remove('locked');
    if (animate) { gate.classList.add('out'); setTimeout(function () { gate.remove(); }, 400); } else gate.remove();
    startOpening();
  }
  var saved = null;
  try { saved = localStorage.getItem('sg-access'); } catch (e) {}
  if (saved === ACCESS_CODE) { unlock(false); return; }
  input.focus();
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim() === ACCESS_CODE) {
      try { localStorage.setItem('sg-access', ACCESS_CODE); } catch (e2) {}
      unlock(true);
    } else {
      err.textContent = 'コードが違います';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      input.select();
    }
  });
})();

// ---------------- listing ----------------
var overlay = document.getElementById('overlay');
var stampBtn = document.getElementById('stampBtn'), loupe = document.getElementById('loupe');
var loupePos = { x: 0, y: 0 };
function openItem(i) { state.open = i; state.view = 0; setLift(-1); renderListing(); overlay.classList.add('open'); document.getElementById('closeBtn').focus(); }
function closeItem() { overlay.classList.remove('open'); state.open = -1; closeFull(); }
function renderListing() {
  var d = ITEMS[state.open], v = d.views[state.view];
  document.getElementById('bigStamp').innerHTML = stampHTML(d, v, { tall: true, postmark: false });
  document.getElementById('found').textContent = DROP_LABEL + '\u00a0 · \u00a0FOUND: ' +
    d.city.replace(/ ([A-Z]{2})$/, ', $1') + ' (' + d.date.split(' ')[0] + ' ' + d.year + ')';
  document.getElementById('nameJa').textContent = d.nameJa;
  document.getElementById('nameEn').textContent = d.nameEn;
  document.getElementById('price').textContent = d.price;
  document.getElementById('grade').textContent = d.grade || '';
  document.getElementById('gradeNote').textContent = d.gradeNote || '';
  document.getElementById('meas').innerHTML = d.meas.map(function (m) { return '<div><span>' + esc(m[0]) + '</span><span>' + esc(m[1]) + '</span></div>'; }).join('');
  var th = document.getElementById('thumbs');
  th.innerHTML = '';
  if (d.views.length > 1) d.views.forEach(function (vv, j) {
    var b = document.createElement('button');
    b.className = j === state.view ? 'on' : '';
    b.setAttribute('aria-label', vv.label || ('表示 ' + (j + 1)));
    b.innerHTML = '<img src="' + vv.full + '" alt="">';
    b.addEventListener('click', function () { state.view = j; loupe.style.display = 'none'; renderListing(); });
    th.appendChild(b);
  });
  loupe.style.backgroundImage = 'url(' + v.img + ')';
  if (v.bleed) fitPriceInk();
}

// on a full-bleed photo, print the stamp price in navy or cream, whichever contrasts more with the photo behind it
function luminance(r, g, b) {
  function lin(c) { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
function fitPriceInk() {
  var box = document.getElementById('bigStamp'), img = box.querySelector('img.bleed'), price = box.querySelector('.stamp-price');
  if (!img || !price) return;
  function run() {
    var art = img.parentNode, W = art.offsetWidth, H = art.offsetHeight, nw = img.naturalWidth, nh = img.naturalHeight;
    if (!W || !nw || !price.isConnected) return;
    var s = Math.max(W / nw, H / nh), ox = (W - nw * s) / 2, oy = (H - nh * s) / 2; // object-fit: cover, centered
    var c = document.createElement('canvas'); c.width = 32; c.height = 8;
    var g = c.getContext('2d'), px;
    g.drawImage(img, (price.offsetLeft - ox) / s, (price.offsetTop - oy) / s, price.offsetWidth / s, price.offsetHeight / s, 0, 0, 32, 8);
    try { px = g.getImageData(0, 0, 32, 8).data; } catch (e) { return; }
    var L = 0;
    for (var i = 0; i < px.length; i += 4) L += luminance(px[i], px[i + 1], px[i + 2]);
    L /= px.length / 4;
    var navy = luminance(0x1E, 0x2A, 0x3A), cream = luminance(0xFF, 0xFD, 0xF6);
    price.style.color = (L + 0.05) / (navy + 0.05) >= (cream + 0.05) / (L + 0.05) ? '#1E2A3A' : '#FFFDF6';
  }
  if (img.complete) requestAnimationFrame(run); else img.addEventListener('load', run);
}
function moveLoupe(e) {
  var d = ITEMS[state.open], v = d.views[state.view];
  var r = stampBtn.getBoundingClientRect(), k = 281 / (r.width || 281);
  var lx = (e.clientX - r.left) * k, ly = (e.clientY - r.top) * k;
  var bgW = 900, bgH = bgW * (v.ar || 1);
  var fx = Math.min(1, Math.max(0, (lx - 22) / 238)), fy = Math.min(1, Math.max(0, (ly - 22) / 316));
  loupe.style.display = 'block';
  loupe.style.left = Math.round(lx - 80) + 'px'; loupe.style.top = Math.round(ly - 80) + 'px';
  loupe.style.backgroundSize = bgW + 'px auto';
  loupe.style.backgroundPosition = Math.round(80 - fx * bgW) + 'px ' + Math.round(80 - fy * bgH) + 'px';
}
stampBtn.addEventListener('mousemove', moveLoupe);
stampBtn.addEventListener('mouseleave', function () { loupe.style.display = 'none'; });
stampBtn.addEventListener('click', openFull);
document.getElementById('closeBtn').addEventListener('click', closeItem);

// ---------------- full photo ----------------
var full = document.getElementById('full');
function openFull() { var d = ITEMS[state.open], v = d.views[state.view]; loupe.style.display = 'none'; showFullLoupe(false); fullLoupe.style.backgroundImage = 'url(' + v.full + ')'; document.getElementById('fullImg').src = v.full; document.getElementById('fullImg').alt = d.nameEn; full.classList.add('open'); }
function closeFull() { full.classList.remove('open'); }

// full view: a larger loupe over the full-resolution photo (hover only; clicking the photo does nothing)
var fullBox = document.querySelector('.full-box'), fullImg = document.getElementById('fullImg'), fullLoupe = document.getElementById('fullLoupe');
var FULL_ZOOM = 3, FULL_C = (208 - 2) / 2; // lens center inside its 1px border
function showFullLoupe(on) { fullLoupe.classList.toggle('active', on); fullBox.classList.toggle('zooming', on); }
fullBox.addEventListener('mousemove', function (e) {
  var nw = fullImg.naturalWidth, nh = fullImg.naturalHeight;
  if (!nw) return;
  var r = fullBox.getBoundingClientRect(), k = 576 / (r.width || 576);
  var x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
  var s = Math.min(576 / nw, 768 / nh), w = nw * s, h = nh * s, ox = (576 - w) / 2, oy = (768 - h) / 2; // object-fit: contain
  if (x < ox || x > ox + w || y < oy || y > oy + h) { showFullLoupe(false); return; }
  showFullLoupe(true);
  fullLoupe.style.left = Math.round(x) + 'px'; fullLoupe.style.top = Math.round(y) + 'px';
  fullLoupe.style.backgroundSize = Math.round(w * FULL_ZOOM) + 'px ' + Math.round(h * FULL_ZOOM) + 'px';
  fullLoupe.style.backgroundPosition = Math.round(FULL_C - (x - ox) * FULL_ZOOM) + 'px ' + Math.round(FULL_C - (y - oy) * FULL_ZOOM) + 'px';
});
fullBox.addEventListener('mouseleave', function () { showFullLoupe(false); });
document.getElementById('fullBg').addEventListener('click', closeFull);
document.getElementById('fullClose').addEventListener('click', closeFull);
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (full.classList.contains('open')) closeFull(); else if (state.open >= 0) closeItem();
});

// homepage drop line reads from DROP
(function () { var el = document.querySelector('.drop-status-current'); if (el) el.textContent = DROP_LABEL + ' 公開中'; })();
// listing addresses: each piece has its own #link
(function () {
  function slug(d) {
    var s = String(d.nameEn || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return (d.drop ? 'no' + d.drop.no + '-' : '') + s;
  }
  function indexFor(hash) {
    var h = decodeURIComponent(String(hash || '').replace(/^#/, ''));
    for (var i = 0; i < ITEMS.length; i++) if (h && slug(ITEMS[i]) === h) return i;
    return -1;
  }
  var baseOpen = openItem, baseClose = closeItem, pushed = false;
  openItem = function (i) {
    baseOpen(i);
    var h = '#' + slug(ITEMS[i]);
    if (location.hash !== h) { history.pushState({ sg: 1 }, '', h); pushed = true; }
  };
  closeItem = function () {
    if (pushed) { pushed = false; history.back(); return; }       // Back closes it via popstate
    baseClose();
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  };
  var closeBtn = document.getElementById('closeBtn');
  closeBtn.removeEventListener('click', baseClose);
  closeBtn.addEventListener('click', function () { closeItem(); });
  window.addEventListener('popstate', function () {
    var i = indexFor(location.hash);
    if (i >= 0) { if (state.open !== i) baseOpen(i); }
    else { pushed = false; if (state.open >= 0) baseClose(); }
  });
  var first = indexFor(location.hash);
  if (first >= 0) baseOpen(first);                                    // a shared link opens that piece
})();
</script>
